<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 750" role="img" aria-labelledby="title desc"><title id="title">Node old space is only part of container memory</title><desc id="desc">Conceptual compartments, not measured sizes. The cgroup charges more than the V8 old-generation heap; a 4096-MiB old-space ceiling leaves no budget for other memory under a 4-GiB limit.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526777"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#203c4a;font-size:17px}.title{font-size:21px;font-weight:700}.small{font-size:15px}.line{stroke:#526777;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="480" height="750" rx="12" fill="#f4f3ee"/>
<text x="240" y="33" text-anchor="middle" class="title">Container limit: 4 GiB = 4096 MiB</text>
<rect x="20" y="55" width="440" height="515" rx="10" fill="#fff" stroke="#9b713d" stroke-width="2"/><rect x="38" y="80" width="404" height="378" rx="8" fill="#e3eeeb" stroke="#146b68"/>
<text x="240" y="111" text-anchor="middle" class="title">Node.js process RSS</text>
<rect x="57" y="132" width="366" height="132" rx="8" fill="#ccdeda"/>
<text x="240" y="159" text-anchor="middle" class="title">V8 heap</text>
<text x="240" y="190" text-anchor="middle" class="">Old generation: max-old-space-size</text>
<text x="240" y="221" text-anchor="middle" class="">+ young generation / other spaces</text>
<text x="240" y="301" text-anchor="middle" class="small">Buffers / ArrayBuffers · native addons</text>
<text x="240" y="331" text-anchor="middle" class="small">Sharp / image buffers · OpenSSL / ICU</text>
<text x="240" y="361" text-anchor="middle" class="small">Stacks · libraries · allocator overhead</text>
<text x="240" y="425" text-anchor="middle" class="small">Categories overlap; not an additive ledger.</text>
<text x="240" y="497" text-anchor="middle" class="">Other processes + kernel memory</text>
<text x="240" y="528" text-anchor="middle" class="">+ charged file cache / tmpfs</text>
<rect x="25" y="590" width="430" height="85" rx="8" fill="#f1e0d9" stroke="#b2c4be"/>
<text x="240" y="618" text-anchor="middle" class="">4096 MiB old space + other charges</text>
<text x="240" y="641" text-anchor="middle" class="">can reach the cgroup ceiling first.</text>
<text x="240" y="705" text-anchor="middle" class="small">Conceptual layout, not to scale.</text>
<text x="240" y="729" text-anchor="middle" class="small">A heap limit is not a reservation or an RSS limit.</text>
</svg>
