<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 820" role="img" aria-labelledby="title desc">
<title id="title">One identity, two namespace-scoped grants</title>
<desc id="desc">The ServiceAccount default/limited-access-user has one token. Two RoleBindings, in namespace1 and namespace2, reference this exact subject and the shared ClusterRole custom-namespace-access. No grant is created in namespace3. Other existing grants must still be audited.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526777"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#203c4a;font-size:17px}.title{font-size:21px;font-weight:700}.small{font-size:15px}.line{stroke:#526777;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="480" height="820" rx="12" fill="#f4f3ee"/>
<text x="240" y="35" text-anchor="middle" class="title">One identity, two scoped grants</text>
<rect x="25" y="65" width="430" height="110" rx="8" fill="#e3eeeb" stroke="#b2c4be"/>
<text x="240.0" y="93" text-anchor="middle" class="">ServiceAccount</text>
<text x="240.0" y="117" text-anchor="middle" class="">default/limited-access-user</text>
<text x="240.0" y="141" text-anchor="middle" class="">One token → same identity</text>
<path d="M240,175 L240,210 L125,210 L125,249" class="line"/>
<path d="M240,210 L355,210 L355,249" class="line"/>
<text x="240" y="237" text-anchor="middle" class="small">Both bind the same subject</text>
<rect x="20" y="259" width="210" height="105" rx="8" fill="#e3eeeb" stroke="#b2c4be"/>
<text x="125.0" y="287" text-anchor="middle" class="small">RoleBinding</text>
<text x="125.0" y="311" text-anchor="middle" class="small">namespace1</text>
<text x="125.0" y="335" text-anchor="middle" class="small">subject namespace: default</text>
<rect x="250" y="259" width="210" height="105" rx="8" fill="#e3eeeb" stroke="#b2c4be"/>
<text x="355.0" y="287" text-anchor="middle" class="small">RoleBinding</text>
<text x="355.0" y="311" text-anchor="middle" class="small">namespace2</text>
<text x="355.0" y="335" text-anchor="middle" class="small">subject namespace: default</text>
<path d="M125,364 L125,445" class="line"/>
<path d="M355,364 L355,445" class="line"/>
<text x="240" y="412" text-anchor="middle" class="small">Shared role</text>
<text x="240" y="435" text-anchor="middle" class="small">reference</text>
<rect x="25" y="455" width="430" height="110" rx="8" fill="#e3eeeb" stroke="#b2c4be"/>
<text x="240.0" y="483" text-anchor="middle" class="">ClusterRole: custom-namespace-access</text>
<text x="240.0" y="507" text-anchor="middle" class="">get / list / watch</text>
<text x="240.0" y="531" text-anchor="middle" class="">pods · services · configmaps</text>
<rect x="25" y="610" width="430" height="85" rx="8" fill="#f1e0d9" stroke="#b2c4be"/>
<text x="240.0" y="638" text-anchor="middle" class="">namespace3: no grant from this setup</text>
<text x="240.0" y="662" text-anchor="middle" class="">Other bindings may still grant access.</text>
<text x="240" y="733" text-anchor="middle" class="">Binding namespace = scope of the grant</text>
<text x="240" y="763" text-anchor="middle" class="">Subject namespace = location of the identity</text>
<text x="240" y="796" text-anchor="middle" class="small">Kubeconfig contexts select defaults, not permissions.</text>
</svg>
