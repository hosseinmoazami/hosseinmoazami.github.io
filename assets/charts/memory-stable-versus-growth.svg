<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 770" role="img" aria-labelledby="title desc"><title id="title">Stable usage versus possible unbounded growth</title><desc id="desc">Conceptual sample paths, not recorded incident telemetry. Stable values fluctuate around 1.8 to 2 GiB; rising values approach a 4 GiB limit. Growth alone is not proof of a leak.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#526777"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#203c4a;font-size:17px}.title{font-size:21px;font-weight:700}.small{font-size:15px}.line{stroke:#526777;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="480" height="770" rx="12" fill="#f4f3ee"/>
<text x="240" y="33" text-anchor="middle" class="title">Memory over time: compare trends</text>
<text x="240" y="85" text-anchor="middle" class="title">Stable workload / bounded working set</text>
<line x1="65" y1="320" x2="440" y2="320" stroke="#d4dcd8"/>
<text x="45" y="325" text-anchor="middle" class="small">0</text>
<line x1="65" y1="272" x2="440" y2="272" stroke="#d4dcd8"/>
<text x="45" y="277" text-anchor="middle" class="small">1</text>
<line x1="65" y1="224" x2="440" y2="224" stroke="#d4dcd8"/>
<text x="45" y="229" text-anchor="middle" class="small">2</text>
<line x1="65" y1="176" x2="440" y2="176" stroke="#d4dcd8"/>
<text x="45" y="181" text-anchor="middle" class="small">3</text>
<line x1="65" y1="128" x2="440" y2="128" stroke="#d4dcd8"/>
<text x="45" y="133" text-anchor="middle" class="small">4</text>
<polyline points="65.0,233.6 158.75,228.8 252.5,224 346.25,228.8 440.0,224" fill="none" stroke="#146b68" stroke-width="3"/>
<text x="80" y="110" text-anchor="middle" class="small">GiB</text>
<text x="240" y="345" text-anchor="middle" class="small">Successive samples →</text>
<text x="240" y="405" text-anchor="middle" class="title">Possible leak / unbounded growth</text>
<line x1="65" y1="640" x2="440" y2="640" stroke="#d4dcd8"/>
<text x="45" y="645" text-anchor="middle" class="small">0</text>
<line x1="65" y1="592" x2="440" y2="592" stroke="#d4dcd8"/>
<text x="45" y="597" text-anchor="middle" class="small">1</text>
<line x1="65" y1="544" x2="440" y2="544" stroke="#d4dcd8"/>
<text x="45" y="549" text-anchor="middle" class="small">2</text>
<line x1="65" y1="496" x2="440" y2="496" stroke="#d4dcd8"/>
<text x="45" y="501" text-anchor="middle" class="small">3</text>
<line x1="65" y1="448" x2="440" y2="448" stroke="#d4dcd8"/>
<text x="45" y="453" text-anchor="middle" class="small">4</text>
<polyline points="65.0,616.5625 127.5,597.8125 190.0,568.0 252.5,539.2 315.0,505.6 377.5,472.0 440.0,452.8" fill="none" stroke="#a6533c" stroke-width="3"/>
<text x="80" y="430" text-anchor="middle" class="small">GiB</text>
<text x="240" y="665" text-anchor="middle" class="small">Successive samples →</text>
<text x="420" y="435" text-anchor="end" class="small">4 GiB limit</text>
<text x="240" y="714" text-anchor="middle" class="small">Continued growth may reach OOM.</text>
<text x="240" y="740" text-anchor="middle" class="small">Illustration only; correlate load and post-GC baseline.</text>
</svg>
